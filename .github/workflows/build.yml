name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.0.0

    - name: Make Gradle executable
      run: chmod +x android/gradlew

    - name: Build APK (Debug)
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.run_number }}
        draft: false
        prerelease: false
        body: |
          ## APK compilado automaticamente ✅
          
          **Build:** ${{ github.run_number }}
          **Branch:** ${{ github.ref }}
          **Commit:** ${{ github.sha }}
          **Data:** ${{ github.event.head_commit.timestamp }}
          
          ### 📥 Como instalar:
          
          #### Opção 1: Via USB (recomendado)
```bash
          adb install app-debug.apk
```
          
          #### Opção 2: Copiar e tocar
          1. Baixe `app-debug.apk`
          2. Copie para o celular (WhatsApp, email, etc)
          3. Abra o arquivo no celular
          4. Toque em "Instalar"
          
          ### 🔧 Requisitos
          - Android 7.0+ (API 24)
          - Permissões: Localização, Overlay, Notificações
          - Conexão WiFi ou dados
          
          ### 🧪 Testar
          1. Abra o app e clique "Iniciar Monitoramento"
          2. Veja a localização em `web/family-locator.html`
          3. Segure o botão 🚨 por 3s para ativar emergência
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Build falhou!"
        echo "Verifique os logs acima para detalhes"